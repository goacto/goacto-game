name: shell-links

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail if Focus Log or the free book guide leaves the web shell
        run: node --test tests/shell-links.test.cjs tests/play-progress.test.cjs tests/goacto-ping.test.cjs
