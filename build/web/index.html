		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #f2f2f0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#gate-progress-wrap {
	display: none;
	width: min(28rem, 90vw);
	margin: 0 auto 8px;
	text-align: left;
}
#gate-progress-wrap[data-active="1"] {
	display: block;
}
#gate-progress {
	width: 100%;
	height: 12px;
	background: #333;
	border-radius: 999px;
	overflow: hidden;
}
#gate-progress-fill {
	height: 100%;
	width: 0%;
	background: #E8A33D;
	border-radius: 999px;
	transition: width 120ms linear;
}
#gate-progress-label {
	margin: 8px 0 0;
	font-size: 0.9rem;
	opacity: 0.9;
}
#status-progress {
	accent-color: #E8A33D;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script src="goacto-ping.js"></script>
<script src="play-progress.js"></script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress" role="progressbar" aria-label="Game download progress" aria-valuemin="0"></progress>
			<div id="status-notice"></div>
		</div>

		
		<!-- Gate: shell paints first; WASM/PCK load only after Play (LCP/TBT/TTI). -->
		<div id="play-gate" style="position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a1a;color:#f5f0e8;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px">
			<img src="index.icon.png" width="96" height="96" alt="" style="margin-bottom:16px;border-radius:16px" />
			<h1 style="margin:0 0 8px;font-size:1.75rem;color:#E8A33D">Mindscape</h1>
			<p style="margin:0 0 20px;opacity:.9;max-width:28rem">A calm focus game from Team GOACTO. Growing Ourselves and Contributing To Others.</p>
			<p style="margin:0 0 24px;font-size:.9rem;opacity:.7">Loads about 85 MB the first time. Wi‑Fi helps.</p>
			<button id="play-btn" type="button" style="appearance:none;border:0;border-radius:999px;padding:14px 28px;background:#E8A33D;color:#1a1a1a;font-weight:700;font-size:1.05rem;cursor:pointer">Play</button>
			<div id="gate-progress-wrap" data-active="0" aria-live="polite">
				<div id="gate-progress" role="progressbar" aria-label="Game download progress" aria-valuemin="0">
					<div id="gate-progress-fill"></div>
				</div>
				<p id="gate-progress-label"></p>
			</div>
		</div>
		<script>
(function () {
	const gate = document.getElementById('play-gate');
	const btn = document.getElementById('play-btn');
	let started = false;

	function loadScript(src) {
		return new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = src;
			s.async = true;
			s.onload = resolve;
			s.onerror = function () { reject(new Error('Failed to load ' + src)); };
			document.body.appendChild(s);
		});
	}

	const gateProgressWrap = document.getElementById('gate-progress-wrap');
	const gateProgress = document.getElementById('gate-progress');
	const gateProgressLabel = document.getElementById('gate-progress-label');
	const PP = window.GoactoPlayProgress || {
		formatBytes: function (n) { return String(n); },
		expectedTotalBytes: function () { return 0; },
		updateProgressBar: function () { return { determinate: false, percent: 0, label: 'Downloading…' }; },
	};

	function showGateProgress() {
		btn.style.display = 'none';
		gateProgressWrap.setAttribute('data-active', '1');
		PP.updateProgressBar(gateProgress, gateProgressLabel, 0, 0, {});
	}

	function hideGate() {
		gate.style.display = 'none';
	}

	function startEngine() {
		if (started) return;
		started = true;
		btn.disabled = true;
		btn.textContent = 'Loading…';
		showGateProgress();

		loadScript('index.js').then(function () {
			const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":50460312,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
			const GODOT_THREADS_ENABLED = false;
			const expectedTotal = PP.expectedTotalBytes(GODOT_CONFIG.fileSizes);
			const engine = new Engine(GODOT_CONFIG);

			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) {
					return;
				}
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
				statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				const lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) {
					setStatusNotice(err.message);
				} else if (typeof err === 'string') {
					setStatusNotice(err);
				} else {
					setStatusNotice('An unknown error occurred.');
				}
				setStatusMode('notice');
				initializing = false;
				gateProgressWrap.setAttribute('data-active', '0');
				btn.style.display = '';
				btn.disabled = false;
				btn.textContent = 'Try again';
				started = false;
			}

			function applyProgress(current, total) {
				PP.updateProgressBar(gateProgress, gateProgressLabel, current, total, { expectedTotal: expectedTotal });
				PP.updateProgressBar(statusProgress, null, current, total, { expectedTotal: expectedTotal });
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});

			if (missing.length !== 0) {
				const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
				displayFailureNotice(missingMsg + missing.join('\n'));
				return;
			}

			// Keep Play gate visible with honest byte bar; mirror onto Godot status bar.
			setStatusMode('progress');
			applyProgress(0, expectedTotal);
			engine.startGame({
				'onProgress': function (current, total) {
					applyProgress(current, total);
				},
			}).then(() => {
				hideGate();
				setStatusMode('hidden');
			}, displayFailureNotice);
		}).catch(function (err) {
			console.error(err);
			gateProgressWrap.setAttribute('data-active', '0');
			btn.style.display = '';
			btn.disabled = false;
			btn.textContent = 'Try again';
			started = false;
			alert('Could not load the game engine. Check your connection and try again.');
		});
	}

	btn.addEventListener('click', startEngine);
})();
		</script>

	</body>
</html>
