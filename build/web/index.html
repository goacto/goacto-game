<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#141a26">
	<title>Mindscape</title>
	<style>
		:root {
			--bg-color: #141a26;
			--accent-color: #4a90d9;
			--text-color: #e0e0e0;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: var(--bg-color);
			color: var(--text-color);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			touch-action: none;
			overflow: hidden;
		}

		#canvas {
			display: block;
			margin: 0;
			padding: 0;
		}

		#canvas:focus {
			outline: none;
		}

		#status {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			z-index: 100;
		}

		#status-progress {
			width: 300px;
			height: 6px;
			background: rgba(255,255,255,0.1);
			border-radius: 3px;
			margin: 20px auto;
			overflow: hidden;
		}

		#status-progress-inner {
			height: 100%;
			background: var(--accent-color);
			width: 0%;
			transition: width 0.3s ease;
			border-radius: 3px;
		}

		#status-notice {
			font-size: 14px;
			color: rgba(255,255,255,0.6);
			margin-top: 15px;
		}

		/* Force reset overlay */
		#reset-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0,0,0,0.9);
			display: none;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			z-index: 9999;
		}

		#reset-overlay.visible {
			display: flex;
		}

		#reset-overlay h2 {
			margin-bottom: 20px;
			color: #ff6b6b;
		}

		#reset-overlay p {
			margin-bottom: 30px;
			color: #aaa;
		}

		.reset-buttons {
			display: flex;
			gap: 15px;
		}

		.reset-btn {
			padding: 12px 30px;
			border: none;
			border-radius: 6px;
			font-size: 16px;
			cursor: pointer;
			transition: transform 0.1s, opacity 0.2s;
		}

		.reset-btn:hover {
			transform: scale(1.05);
		}

		.reset-btn.confirm {
			background: #ff6b6b;
			color: white;
		}

		.reset-btn.cancel {
			background: #333;
			color: white;
		}

		/* Hotkey hint */
		#hotkey-hint {
			position: fixed;
			bottom: 10px;
			right: 10px;
			font-size: 11px;
			color: rgba(255,255,255,0.3);
			z-index: 50;
			pointer-events: none;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
	<canvas id="canvas"></canvas>

	<div id="status">
		<div id="status-progress">
			<div id="status-progress-inner"></div>
		</div>
		<div id="status-notice">Loading...</div>
	</div>

	<!-- Force Reset Overlay -->
	<div id="reset-overlay">
		<h2>Force Reset Game?</h2>
		<p>This will reload the page. Unsaved progress may be lost.</p>
		<div class="reset-buttons">
			<button class="reset-btn confirm" onclick="forceReload()">Reset Game</button>
			<button class="reset-btn cancel" onclick="hideResetOverlay()">Cancel</button>
		</div>
	</div>

	<div id="hotkey-hint">Ctrl+Shift+R to reset if stuck</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":49796444,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
		const engine = new Engine(GODOT_CONFIG);

		const statusProgress = document.getElementById('status-progress-inner');
		const statusNotice = document.getElementById('status-notice');
		const status = document.getElementById('status');
		const resetOverlay = document.getElementById('reset-overlay');

		// Force reset functions
		function showResetOverlay() {
			resetOverlay.classList.add('visible');
		}

		function hideResetOverlay() {
			resetOverlay.classList.remove('visible');
		}

		function forceReload() {
			// Clear any cached state
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.getRegistrations().then(function(registrations) {
					for (let registration of registrations) {
						registration.unregister();
					}
				});
			}
			// Hard reload
			location.reload(true);
		}

		// Keyboard shortcut: Ctrl+Shift+R to show reset overlay
		document.addEventListener('keydown', function(e) {
			if (e.ctrlKey && e.shiftKey && e.key === 'R') {
				e.preventDefault();
				showResetOverlay();
			}
			// Escape to close overlay
			if (e.key === 'Escape' && resetOverlay.classList.contains('visible')) {
				hideResetOverlay();
			}
		});

		// Also expose to Godot via JavaScript bridge
		window.showResetOverlay = showResetOverlay;
		window.forceReload = forceReload;

		// Start engine
		(function() {
			const setStatusMode = function(mode) {
				if (mode === 'hidden') {
					status.style.display = 'none';
				} else {
					status.style.display = 'block';
				}
			};

			const setStatusProgress = function(current, total) {
				if (total > 0) {
					const percent = (current / total) * 100;
					statusProgress.style.width = percent + '%';
					statusNotice.textContent = 'Loading... ' + Math.round(percent) + '%';
				}
			};

			const displayFailure = function(err) {
				statusNotice.textContent = 'Error: ' + err;
				statusNotice.style.color = '#ff6b6b';
			};

			engine.setProgressFunc((current, total) => {
				setStatusProgress(current, total);
			});

			engine.startGame().then(() => {
				setStatusMode('hidden');
				// Hide hotkey hint after 10 seconds
				setTimeout(() => {
					document.getElementById('hotkey-hint').style.opacity = '0';
				}, 10000);
			}).catch((err) => {
				displayFailure(err);
			});
		})();
	</script>
</body>
</html>
